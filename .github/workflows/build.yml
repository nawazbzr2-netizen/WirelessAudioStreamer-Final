name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack complete source
        run: |
          if ls scripts/was_*.b64 1>/dev/null 2>&1; then
            cat scripts/was_*.b64 | base64 -d > /tmp/src.zip
            unzip -o /tmp/src.zip -d /tmp/src
            cp -a /tmp/src/. .
          fi
          echo "=== Source files ==="
          find app/src -type f 2>/dev/null | sort || true
          test -f app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          test -f app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          echo Critical files OK

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessAudioStreamer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessAudioStreamer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
