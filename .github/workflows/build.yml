name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore compressed + full source
        run: |
          set -e
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/wireless/audiostreamer/ui
          mkdir -p app/src/main/java/com/wireless/audiostreamer/service
          # Prefer complete ZIP if all parts present
          if [ -f scripts/src_00.b64 ] && [ -f scripts/src_20.b64 ]; then
            PARTS=$(ls scripts/src_*.b64 2>/dev/null | wc -l)
            echo "Found $PARTS src parts"
            if [ "$PARTS" -ge 21 ]; then
              cat scripts/src_*.b64 | base64 -d > /tmp/src.zip
              unzip -o /tmp/src.zip -d /tmp/src
              cp -a /tmp/src/. .
              echo "Unpacked full ZIP"
            fi
          fi
          # Fallback: zlib-compressed individual files
          restore() {
            local b64="$1" out="$2"
            if [ -f "$b64" ]; then
              base64 -d "$b64" | python3 -c "import sys,zlib; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))" > "$out" || true
            fi
          }
          restore scripts/z_activity_main.b64 app/src/main/res/layout/activity_main.xml
          restore scripts/z_activity_settings.b64 app/src/main/res/layout/activity_settings.xml
          restore scripts/z_MainActivity.b64 app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          restore scripts/z_StreamingService.b64 app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          echo "=== Source ==="
          find app/src -type f | sort
          ls -la app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt 2>/dev/null || echo MISSING MainActivity
          ls -la app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt 2>/dev/null || echo MISSING StreamingService

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessAudioStreamer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessAudioStreamer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
